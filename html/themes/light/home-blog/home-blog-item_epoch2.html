<tr>
  <td>
    <table class="boat-rudder__home-blog__item" border="0" cellspacing="0" cellpadding="0" width="100%%">
      <tr>
        <td>
          <table border="1" bordercolor="%10$s" cellspacing="0" cellpadding="10" width="100%%" background="/themes/light/assets/home-content/background-blog-list-xl.gif">
            <tr>
              <td class="boat-rudder__home-blog__item__image" valign="top">
                <table width="100%%" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <!-- Thumbnail and text sit in two cells, not an align="left"
                         float: Netscape 4 does not keep a float inside its cell,
                         so it escaped into the byline row below and printed the
                         author across the picture. -->
                    <td valign="top" width="190">
                      <a href="%2$s">
                        <img src="%1$s" alt="" width="180" border="0" hspace="5" vspace="5">
                      </a>
                    </td>
                    <td valign="top">
                      <a href="%2$s">
                        <h2><font face="Arial, Helvetica">%3$s</font></h2>
                      </a>

                      <p><font face="Arial, Helvetica">%4$s</font></p>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <table class="boat-rudder__home-blog__item__container" width="100%%" border="0" cellspacing="0" cellpadding="0">
                        <tr><td height="10"></td></tr>
                        <tr>
                          <td align="left"><font face="Arial, Helvetica" color="%5$s">%6$s</font></td>
                          <td align="center">%7$s</td>
                          <td align="right"><font face="Arial, Helvetica" color="%8$s">%9$s</font></td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <table>
            <tr>
              <td height="20"></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
